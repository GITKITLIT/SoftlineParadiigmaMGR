name: Final UI targeted Nginx
on:
  push:
    branches: [ci/final-ui-nginx-ebee5c6]
permissions:
  contents: read
jobs:
  nginx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebee5c60855332bc43b8de85faf965d91d7a2ebe
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact candidate and install test dependencies
        run: |
          test "$(git rev-parse HEAD)" = "ebee5c60855332bc43b8de85faf965d91d7a2ebe"
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils openssl
          python -m pip install -r requirements.txt
      - name: Exercise Nginx, TLS, auth and CSP on the candidate
        run: python -m unittest discover -s tests -p test_deployment_proxy.py -v
