name: Final UI targeted Nginx
on:
  push:
    branches: [ci/final-ui-nginx-834aefa]
permissions:
  contents: read
jobs:
  nginx:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 834aefa5c86a44dea77fa6eb061f2e866763af3d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact candidate and install test dependencies
        run: |
          test "$(git rev-parse HEAD)" = "834aefa5c86a44dea77fa6eb061f2e866763af3d"
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils openssl
          python -m pip install -r requirements.txt
      - name: Exercise Nginx, TLS, auth and CSP on the candidate
        run: python -m unittest discover -s tests -p test_deployment_proxy.py -v
