name: Deployment acceptance
on:
  push:
    branches: [feature/deployment]
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/deploy/**'
      - 'tests/test_deployment*'
      - 'tests/deployment_*.sh'
      - 'scripts/pim_backup.py'
      - 'app.py'
      - 'pm/**'
      - 'requirements.txt'
      - '.github/workflows/deployment.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Scan the published tree and new commits for secrets
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE=origin/main
          fi
          python scripts/deploy/scan_index.py --since "$BASE"
      - run: python -m pip install -r requirements.txt
      - name: Install proxy test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx apache2-utils
      - run: python -m unittest discover -s tests -v
  clean-install:
    name: Clean install, rollback and backup permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install and exercise disposable systemd services
        run: sudo bash tests/deployment_clean_install.sh --disposable-vm
      - name: Exercise restricted SSH forwarding
        run: sudo bash tests/deployment_ssh_tunnel.sh --disposable-vm
      - name: Test isolated Linux backup permissions
        run: sudo python3 -m unittest discover -s tests -p test_deployment_backup.py -v
      - name: Fetch the pinned Core and Search test inputs
        run: git fetch --no-tags origin b71424d71468ccbdd9a2ceb7c44799fc07abe334 93de5460148982747093bfe50e34dbc57abbb88c
      - name: Rehearse Core v6, SMTP and restore on disposable state
        run: sudo bash tests/deployment_core_v6.sh --disposable-vm
      - name: Show synthetic service failures
        if: failure()
        run: |
          sudo journalctl --no-pager -n 60 -u 'paradiigma*' -u run-paradiigma_backup_input.mount
          sudo journalctl -k --no-pager -g 'apparmor="DENIED"' -n 20 || true
