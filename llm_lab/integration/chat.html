<button type="button" id="qwen-fab" aria-label="Открыть ИИ-помощника" aria-controls="qwen-panel" aria-expanded="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 7V4m-4 8h.01m8 0h.01M9 16h6"/></svg></button>
<section id="qwen-panel" hidden aria-labelledby="qwen-heading">
  <div class="qwen-bar"><h2 id="qwen-heading">Диалоги</h2><button type="button" id="qwen-close" aria-label="Вернуться к предыдущему разделу">×</button></div>
  <div class="qwen-bar">
    <label>Диалог<select id="qwen-dialogs"></select></label>
    <button type="button" id="qwen-new" class="secondary">Новый диалог</button>
  </div>
  <div id="qwen-log" role="log" aria-label="Сообщения"></div>
  <p id="qwen-progress" role="status"></p>
  <form id="qwen-ask">
    <label>Вопрос<textarea id="qwen-question" required maxlength="500" rows="2"></textarea></label>
    <div class="qwen-bar">
      <label>Контекст<select id="qwen-mode"><option value="auto">Автоматически</option><option value="follow_up">Уточнение</option><option value="new_topic">Новая тема</option></select></label>
      <button type="submit">Спросить</button>
    </div>
  </form>
</section>
