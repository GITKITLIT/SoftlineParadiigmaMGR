# Append at END of /etc/ssh/sshd_config (after global directives) on Ubuntu.
Match Group pm-tunnel
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/pm-authorized-keys/%u
    MaxSessions 0
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8080
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
